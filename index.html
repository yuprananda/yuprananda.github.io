<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Yu Prananda &#8212; frontend developer crafting simple, beautiful, and intuitive digital experiences."
    />
    <title>Yu Prananda &#8212; Frontend Developer</title>
    <link rel="icon" type="image/png" href="assets/images/logo-yu.png" />
    <link rel="apple-touch-icon" href="assets/images/logo-yu.png" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <header>
      <a href="#hello" class="brand"
        ><img
          class="brand-mark"
          src="assets/images/logo-yu.png"
          alt=""
          width="34"
          height="34"
          aria-hidden="true"
        /><span class="brand-copy"
          ><strong class="brand-name">Yu Prananda</strong
          ><span class="brand-role">frontend developer</span></span
        ></a
      >
      <nav aria-label="Sections"></nav>
      <div class="languages">
        <button data-lang="en">EN</button><span>/</span
        ><button data-lang="id">ID</button>
      </div>
    </header>
    <!-- Page content is rendered from assets/js/content.js. -->
    <main id="pages"></main>
    <noscript
      >This portfolio needs JavaScript for its horizontal pages. Contact:
      <a href="mailto:hello.yuprananda@gmail.com">hello.yuprananda@gmail.com</a
      >.</noscript
    >
    <footer>
      <span class="footer-credit" id="footer-credit"
        >Experience, simplicity, and beauty.</span
      >
      <span class="sr-only" id="hint"></span>
      <div class="footer-navigation">
        <span id="position"></span>
        <div class="footer-arrows">
          <button id="prev" aria-label="Previous page">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12 6 8l4-4"/></svg>
          </button>
          <button id="next" aria-label="Next page">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 12 4-4-4-4"/></svg>
          </button>
        </div>
      </div>
    </footer>
    <!-- Deferred scripts run in dependency order, including when opened as a local file. -->
    <script defer src="assets/js/config.js"></script>
    <script defer src="assets/js/content.js"></script>
    <script defer src="assets/js/icons.js"></script>
    <script defer src="assets/js/project-view.js"></script>
    <script defer src="assets/js/app.js"></script>
  </body>
</html>
